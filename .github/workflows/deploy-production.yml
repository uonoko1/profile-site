name: Deploy to production

on:
  # 本番は手動実行のみ。staging で確認してから流す
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync to production
        run: |
          # --omit-dir-times: 配信ディレクトリ自体の所有者が deploy ユーザーと
          # 異なる場合に、mtime の設定だけで失敗するのを避ける
          rsync -az --delete --omit-dir-times \
            -e "ssh -i ~/.ssh/id_ed25519" \
            dist/ "${{ secrets.USER }}@${{ secrets.HOST }}:/var/www/daichisakai.net/"

      - name: Verify
        run: |
          fail=0
          for path in / /blog/ /blog/scala-heap-dump-analysis/; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://daichisakai.net${path}")
            printf '%-36s %s\n' "$path" "$code"
            [ "$code" = "200" ] || fail=1
          done
          # トップだけ 200 でも、配信物が新旧混ざっていれば下層が 500 になる。
          exit $fail
